<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dr. Martins Odiamenhi — RF Systems &amp; Energy Modelling</title>
    <meta name="description" content="Portfolio of Dr. Martins Odiamenhi. RF Systems, Wireless Power Transfer &amp; Nonlinear Energy Modelling." />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored || 'dark';
          if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
